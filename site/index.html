  <meta name="theme-color" content="#121317">

  <noscript><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"></noscript>
  <link rel="stylesheet" href="assets/style.css?v=61d13657">

</head>
<body>
  <a class="skip" href="#app">본문 바로가기</a>
  <div class="frame">
    <header class="top">
      <a class="brand" href="#/" aria-label="EASY ALGS KR 홈">
        <svg viewBox="0 0 24 24" aria-hidden="true" class="brand-mark"><circle cx="12" cy="12" r="9.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-dasharray="44 16"/><circle cx="12" cy="12" r="3.4" fill="var(--ring)"/></svg>
        <span>EASY ALGS KR</span>
      </a>
      <div class="top-right">
      <button class="pill" id="refreshPill" type="button" aria-label="갱신 주기 보기"><span class="pill-dot"></span><span id="refreshText">정기 갱신</span></button>
      <button class="icon-btn" id="feedbackBtn" type="button" aria-label="문의·피드백" aria-haspopup="dialog" title="문의·피드백"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/><path d="M8 9.5h8M8 12.5h5" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg></button>
      <button class="icon-btn" id="settingsBtn" aria-label="설정 열기" aria-haspopup="dialog">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/><circle cx="16" cy="7" r="2.2" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="10" cy="17" r="2.2" fill="none" stroke="currentColor" stroke-width="2"/></svg>
      </button>
      </div>
    </header>

    <nav class="tabbar" aria-label="주 메뉴">
      <a href="#/" data-tab="home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11l8-6 8 6v8h-5v-5H9v5H4z" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/></svg>홈</a>
      <a href="#/schedule" data-tab="schedule"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5.5" width="16" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="1.9"/><path d="M4 10h16M9 3.5v4M15 3.5v4" stroke="currentColor" stroke-width="1.9"/></svg>경기</a>
      <a href="#/standings" data-tab="standings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V12M12 20V5M19 20v-5" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>순위</a>
      <a href="#/streams" data-tab="streams"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="2.2" fill="currentColor"/><path d="M8 8a5.6 5.6 0 000 8M16 8a5.6 5.6 0 010 8M5.2 5.2a9.6 9.6 0 000 13.6M18.8 5.2a9.6 9.6 0 010 13.6" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>방송</a>
      <a href="#/teams" data-tab="teams"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="9" r="3" fill="none" stroke="currentColor" stroke-width="1.9"/><circle cx="17" cy="10" r="2.4" fill="none" stroke="currentColor" stroke-width="1.9"/><path d="M3.5 19c.8-3 3-4.5 5.5-4.5s4.7 1.5 5.5 4.5M15 15c2.5-.4 4.6.7 5.5 3.5" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>팀</a>
      <a href="#/more" role="button" data-tab="more" id="moreBtn" aria-haspopup="true" aria-expanded="false" aria-controls="moreMenu"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5.5" cy="12" r="1.8" fill="currentColor"/><circle cx="12" cy="12" r="1.8" fill="currentColor"/><circle cx="18.5" cy="12" r="1.8" fill="currentColor"/></svg><span>더보기</span></a>
      <div class="tab-more" id="moreMenu">
        <a href="#/points/cp" data-tab="points"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="1.9" stroke-dasharray="30 8"/><path d="M12 8v4l3 2" stroke="currentColor" stroke-width="1.9" fill="none" stroke-linecap="round"/></svg>포인트</a>
        <a href="#/rules" data-tab="rules"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4h9l3 3v13H6z" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/><path d="M9 11h6M9 15h6" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg><span>규칙</span></a>
      </div>
    </nav>

    <main id="app" tabindex="-1"></main>

    <footer class="foot">
      <p>비공식 팬 사이트입니다. EA·Respawn과 관련이 없습니다.</p>
      <p id="sourceLine"></p>
      <p><button class="link-btn" type="button" data-feedback="기타">문의·피드백 보내기</button></p>
    </footer>

  </div>

  <dialog id="feedback" aria-labelledby="feedbackTitle">
    <form method="dialog">
      <h2 id="feedbackTitle">문의·피드백</h2>
      <p class="dlg-note">무엇에 대한 내용인가요? 고르면 작성 화면이 새 창으로 열리고, 지금 보던 화면 주소가 미리 채워집니다. 개인 정보는 넣지 마세요.</p>
      <div class="fb-kinds">
        <button type="button" class="fb-kind" data-kind="데이터 오류"><b>데이터 오류</b><span>순위·점수·로스터가 틀렸어요</span></button>
        <button type="button" class="fb-kind" data-kind="채널 제보"><b>채널 제보</b><span>선수 CHZZK·YouTube 주소를 알려 줄게요</span></button>
        <button type="button" class="fb-kind" data-kind="기능 제안"><b>기능 제안</b><span>이런 기능이 있으면 좋겠어요</span></button>
        <button type="button" class="fb-kind" data-kind="기타"><b>기타 문의</b><span>그 밖의 이야기</span></button>
      </div>
      <button class="btn" value="close">닫기</button>
    </form>
  </dialog>

  <dialog id="settings" aria-labelledby="settingsTitle">
    <form method="dialog">
      <h2 id="settingsTitle">설정</h2>
      <label class="switch"><input type="checkbox" id="optDark"> <span>다크 모드</span></label>
      <label class="switch"><input type="checkbox" id="optSpoiler"> <span>결과 가리기 (스포일러 방지)<small class="sw-note">점수·순위·진출 결과를 가리고, 대회별로 눌러서 공개합니다</small></span></label>
      <label class="switch"><input type="checkbox" id="optKrOnly"> <span>표에서 관심 팀만 보기<small class="sw-note">보기 모드(한국 팀 · APAC North · 내 응원 팀)의 팀만</small></span></label>
      <h3 class="dlg-h">언어 · Language</h3>
      <div class="seg lang-seg" role="group" aria-label="Language" data-no-tr><button type="button" data-lang="ko">한국어</button><button type="button" data-lang="ja">日本語</button><button type="button" data-lang="en">English</button></div>
      <h3 class="dlg-h">갱신 주기</h3>
      <div class="dlg-note" id="refreshInfo"></div>
      <h3 class="dlg-h">데이터 출처</h3>
      <div class="dlg-note" id="dataInfo"></div>
      <button class="btn" value="close">닫기</button>
    </form>
  </dialog>

</html>
