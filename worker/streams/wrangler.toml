name = "algs-kr-streams"
main = "worker.js"
compatibility_date = "2026-10-01"
workers_dev = true

# 방송 제목 번역용 Workers AI (무료 할당량: 하루 10,000 뉴런. 넘으면 번역만 멈춘다)
[ai]
binding = "AI"

# 2분마다 방송 상태를 모아 KV 에 적는다 (KV 묶음은 배포 워크플로가 만들어 아래에 덧붙인다)
[triggers]
crons = ["*/2 * * * *"]

[vars]
SITE_URL = "https://laplussugar.github.io/algs-kr"
ALLOWED_ORIGIN = "https://laplussugar.github.io"
VIDEO_DAYS = "21"
LIVE_TTL = "60"
