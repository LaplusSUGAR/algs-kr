name: build-data

on:
  schedule:
    - cron: '*/5 * * * *'    # 5분마다 (GitHub 예약 실행의 최소 간격. 경기 중 초 단위 점수는 브라우저 실시간 조회가 담당)
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['site/**', 'scripts/**', 'config/**']

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Liquipedia (1순위)
        env:
          LIQUIPEDIA_API_KEY: ${{ secrets.LIQUIPEDIA_API_KEY }}
        run: node scripts/fetch-liquipedia.mjs
      - name: ALGS 공식 API
        run: node scripts/fetch-algs.mjs
      - name: Battlefy
        run: node scripts/fetch-battlefy.mjs
      - name: 병합·빌드
        run: node scripts/build-data.mjs
      - name: 바뀐 데이터만 커밋
        id: commit
        run: |
          git config user.name "algs-kr-bot"
          git config user.email "actions@users.noreply.github.com"
          git add raw site/data
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "data: $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-pages-artifact@v3
        if: steps.commit.outputs.changed == 'true' || github.event_name != 'schedule'
        with:
          path: site
  deploy:
    needs: build
    if: needs.build.outputs.changed == 'true' || github.event_name != 'schedule'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/deploy-pages@v4
