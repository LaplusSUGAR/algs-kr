name: build-data

on:
  # 5분 갱신은 맨 아래 'next' 작업이 맡는다: 실행이 끝나면 시작한 지 5분이 되도록 기다렸다가 다음 실행을 직접 건다.
  # GitHub 예약 실행(cron)은 몇 시간씩 밀리거나 빠지기도 해서 예비로만 둔다 (이어 달리기가 끊기면 다시 잇는다).
  # 멈추려면 저장소 Settings → Secrets and variables → Actions → Variables 에 AUTO_REFRESH = off
  # 경기 중 초 단위 점수는 빌드와 상관없이 브라우저 실시간 조회가 담당
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      chain:
        description: "자동 이어 달리기로 걸린 실행이면 1 (바뀐 데이터가 있을 때만 배포)"
        required: false
        default: '0'
  push:
    branches: [main]
    paths: ['site/**', 'scripts/**', 'config/**', 'logos-src/**', '.github/workflows/**']

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write   # next 작업이 다음 실행을 건다

concurrency:
  group: build-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
      t0: ${{ steps.t0.outputs.t0 }}
    steps:
      - name: 시작 시각
        id: t0
        run: echo "t0=$(date +%s)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Liquipedia (1순위)
        env:
          LIQUIPEDIA_API_KEY: ${{ secrets.LIQUIPEDIA_API_KEY }}
        run: node scripts/fetch-liquipedia.mjs
      - name: ALGS 공식 API
        run: node scripts/fetch-algs.mjs
      - name: LCQ 출전 팀 (Liquipedia 위키 원문, 매시 1회)
        run: node scripts/fetch-lcq-lp.mjs
      - name: Liquipedia 팀 이름·선수·로고 아이콘 (페이지마다 7일에 1회)
        run: node scripts/fetch-lp-teams.mjs
      - name: 팀 로고 (Liquipedia 확인 → 이름·선수 대조 → 받기·캡처 → 64·160px WebP, 새로 만들 것이 있을 때만 도구 설치)
        run: node scripts/logos.mjs --plan || (npm i --no-save --no-package-lock sharp@0.33 playwright-core@1.47.2 && node scripts/logos.mjs)
      - name: Battlefy
        run: node scripts/fetch-battlefy.mjs
      - name: 병합·빌드
        run: node scripts/build-data.mjs
      - name: 바뀐 데이터만 커밋
        id: commit
        run: |
          git config user.name "algs-kr-bot"
          git config user.email "actions@users.noreply.github.com"
          git add raw logs site/data site/index.html site/logos
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "data: $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      # 배포: 데이터가 바뀌었을 때, 또는 코드 변경(push)·직접 실행일 때. 예약·이어 달리기 실행은 바뀐 게 없으면 배포하지 않는다
      - uses: actions/upload-pages-artifact@v3
        if: steps.commit.outputs.changed == 'true' || (github.event_name != 'schedule' && inputs.chain != '1')
        with:
          path: site
  deploy:
    needs: build
    if: needs.build.outputs.changed == 'true' || (github.event_name != 'schedule' && inputs.chain != '1')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/deploy-pages@v4
  # 다음 실행 걸기 (빌드가 실패해도 이어 간다). 이미 기다리거나 도는 다른 실행이 있으면 그 실행이 이어 가므로 건너뛴다
  next:
    needs: [build, deploy]
    if: always() && vars.AUTO_REFRESH != 'off' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: 시작한 지 5분이 되도록 기다린 뒤 다음 실행
        env:
          GH_TOKEN: ${{ github.token }}
          T0: ${{ needs.build.outputs.t0 }}
        run: |
          now=$(date +%s); left=$(( 300 - (now - ${T0:-$now}) ))
          if [ "$left" -gt 0 ]; then sleep "$left"; fi
          busy=$(gh run list -R "$GITHUB_REPOSITORY" --workflow build.yml --limit 20 --json databaseId,status \
            -q "[.[] | select(.databaseId != $GITHUB_RUN_ID) | select(.status != \"completed\")] | length")
          if [ "$busy" = "0" ]; then
            gh workflow run build.yml -R "$GITHUB_REPOSITORY" --ref main -f chain=1 && echo "다음 실행을 걸었습니다"
          else
            echo "이미 기다리는 실행이 있어 건너뜀 ($busy)"
          fi
