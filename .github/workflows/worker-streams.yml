name: 방송 상태 Worker 배포

# worker/streams (Cloudflare Worker)를 배포한다. 저장소 Secrets에 아래 값이 있어야 한다.
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID : Cloudflare 배포용
#   TWITCH_CLIENT_ID, TWITCH_CLIENT_SECRET      : Twitch 방송 중 확인
#   YOUTUBE_API_KEY                             : YouTube 방송 중 확인, @핸들 → 채널 ID
# 값이 없는 플랫폼은 건너뛰고(그 플랫폼만 '확인 안 됨'), Cloudflare 값이 없으면 배포 자체를 건너뛴다.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['worker/streams/**', '.github/workflows/worker-streams.yml']

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cloudflare 값 확인
        id: has
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then echo "ok=1" >> "$GITHUB_OUTPUT"; else echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID 가 없어 배포를 건너뜁니다."; fi
      - name: workers.dev 주소 이름 확인 (없으면 등록)
        if: steps.has.outputs.ok == '1'
        run: |
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain"
          cur=$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api" | jq -r '.result.subdomain // empty')
          if [ -z "$cur" ]; then
            for name in laplussugar laplussugar-algs; do
              ok=$(curl -sS -X PUT -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" -d "{\"subdomain\":\"$name\"}" "$api" | jq -r '.success')
              if [ "$ok" = "true" ]; then cur=$name; break; fi
            done
          fi
          if [ -z "$cur" ]; then echo "::error::workers.dev 주소 이름을 등록하지 못했습니다. Cloudflare 대시보드의 Workers & Pages에서 직접 만들어 주세요."; exit 1; fi
          echo "workers.dev 이름: $cur"
          echo "SUB=$cur" >> "$GITHUB_ENV"
      - name: 배포
        if: steps.has.outputs.ok == '1'
        working-directory: worker/streams
        run: npx --yes wrangler@4 deploy
      - name: 비밀 값 등록 (있는 것만)
        if: steps.has.outputs.ok == '1'
        working-directory: worker/streams
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          for n in TWITCH_CLIENT_ID TWITCH_CLIENT_SECRET YOUTUBE_API_KEY; do
            v="${!n}"
            if [ -n "$v" ]; then printf '%s' "$v" | npx --yes wrangler@4 secret put "$n" >/dev/null && echo "$n 등록"; else echo "::notice::$n 없음 (해당 플랫폼은 확인하지 않음)"; fi
          done
      - name: 동작 확인
        if: steps.has.outputs.ok == '1'
        run: |
          url="https://algs-kr-streams.$SUB.workers.dev/streams.json"
          echo "주소: $url"
          for i in 1 2 3 4 5 6; do
            body=$(curl -sS -m 20 "$url" || true)
            if echo "$body" | jq -e '.live' >/dev/null 2>&1; then break; fi
            sleep 10
          done
          echo "$body" | jq '{at, ok, err, calls, live: [.live[] | select(.intl | not) | {who, platform, viewers, title}], videos: (.videos | length), shorts: ([.videos[] | select(.short)] | length), twitchVods: ([.videos[] | select(.platform == "twitch")] | length), intlLive: ([.live[] | select(.intl)] | length), firstVideos: [.videos[:3][] | {who, platform, title, published}], firstVods: ([.videos[] | select(.platform == "twitch")][:3] | map({who, title, dur, thumb: (.thumb != null)}))}'
